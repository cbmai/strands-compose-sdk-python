# single agent

models:
  #MLX (Apple Silicon) via hugging face (run with: `mlx_lm.server --model Qwen/Qwen3-4B-MLX-4bit --port 8080`)
  local:
    provider: openai
    model_id: Qwen/Qwen3-4B-MLX-4bit
    params:
      client_args:
        base_url: http://localhost:8080/v1
        api_key: not-needed        # mlx_lm.server not need key but openai client need
      params:
        # extra_body = send field that not in the OpenAI spec through the SDK to the mlx_lm.server
        extra_body:
          chat_template_kwargs:
            enable_thinking: false

  # #Ollama
  # local:
  #   provider: ollama
  #   model_id: qwen3.5:4b
  #   params:
  #     host: http://localhost:11434

agents:
  assistant:
    model: local
    system_prompt: |
      You are a concise assistant.

      Answer directly from your own knowledge whenever you can.
      Only use a tool when the request truly needs it:
      - current_time: only when asked about the current date or time
      - save_note: ONLY when the user explicitly asks to save or write a note
      - list_notes: only when asked what notes exist
      Never save a note unless asked. After a tool runs, reply to the user in text.
    tools:
      - ./tools.py
      - strands_tools.http_request
      - strands_tools.file_read
    agent_kwargs:
      callback_handler: null

entry: assistant      # match with orchestrations (multiple-agent) or agent (single-agent)




